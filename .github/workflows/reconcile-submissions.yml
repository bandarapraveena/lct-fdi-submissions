name: Reconcile submissions (weekly safety net)

# #2 of the pipeline fix: a weekly sweep that catches anything the per-issue job
# missed — issues opened before the automation existed, edited later, or where a
# transient failure skipped the commit. Also runnable on demand.

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: pending-csv        # shares the lock with the per-issue job
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure triage labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create logged       --color 0E8A16 --description "Copied into pending_submissions.csv" --force
          gh label create correction   --color FBCA04 --description "Update to an existing project, not a new one" --force
          gh label create needs-source --color D93F0B --description "No usable source URL yet" --force
      - name: Sweep all open issues into the pending log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_submissions.py --all-open
      - name: Commit CSV if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pending_submissions.csv
          if git diff --cached --quiet; then
            echo "No CSV change."
          else
            git commit -m "Weekly reconcile: log new submissions to pending CSV"
            git push
          fi
