name: Log submission to pending CSV

# #1 of the pipeline fix: the moment a submission issue is opened, append it to
# pending_submissions.csv so it can never sit untriaged and invisible again.

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write   # commit the CSV
  issues: write     # add labels + comment

concurrency:
  group: pending-csv        # serialize with the reconcile job so commits don't race
  cancel-in-progress: false

jobs:
  log:
    if: contains(github.event.issue.labels.*.name, 'submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure triage labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create logged       --color 0E8A16 --description "Copied into pending_submissions.csv" --force
          gh label create correction   --color FBCA04 --description "Update to an existing project, not a new one" --force
          gh label create needs-source --color D93F0B --description "No usable source URL yet" --force
          gh label create duplicate    --color CCCCCC --description "Duplicate of an existing/other project" --force
      - name: Sync this issue into the pending log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_submissions.py --issue ${{ github.event.issue.number }}
      - name: Commit CSV if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pending_submissions.csv
          if git diff --cached --quiet; then
            echo "No CSV change."
          else
            git commit -m "Auto-log submission from issue #${{ github.event.issue.number }}"
            git push
          fi
